version: 2

sources:
  - name: raw
    description: "Read-only raw OLTP tables loaded from Antojitos Express into PostgreSQL"
    database: "{{ env_var('RAW_DB_NAME', 'raw') }}"
    schema: "{{ env_var('RAW_SCHEMA', 'public') }}"
    tables:
      - name: zonas
        description: "Delivery zones with geographical and base delivery fee configuration"
        columns:
          - name: id_zona
            description: "Primary key for delivery zones"
            tests:
              - unique
              - not_null

      - name: repartidores
        description: "Delivery drivers, vehicle types, ratings, and current status"
        columns:
          - name: id_repartidor
            description: "Primary key for drivers"
            tests:
              - unique
              - not_null

      - name: categorias_platillo
        description: "Dish categories and margin percentage"
        columns:
          - name: id_categoria
            description: "Primary key for dish categories"
            tests:
              - unique
              - not_null

      - name: platillos
        description: "Menu items, pricing, ingredient costs, prep time, and oven requirements"
        columns:
          - name: id_platillo
            description: "Primary key for dishes"
            tests:
              - unique
              - not_null

      - name: promociones
        description: "Marketing campaigns, campaign budgets, expected returns, and discount percentages"
        columns:
          - name: id_promocion
            description: "Primary key for promotions"
            tests:
              - unique
              - not_null

      - name: clima_diario
        description: "Daily weather conditions in Managua (precipitation, temp, weather condition)"
        columns:
          - name: fecha
            description: "Primary key date for weather records"
            tests:
              - unique
              - not_null

      - name: ordenes
        description: "Customer orders with payment methods, status, delivery notes, and fees"
        columns:
          - name: id_orden
            description: "Primary key for orders"
            tests:
              - unique
              - not_null

      - name: detalle_ordenes
        description: "Line items per order linking to platillos, quantities, and subtotals"
        columns:
          - name: id_detalle
            description: "Primary key for order line items"
            tests:
              - unique
              - not_null
